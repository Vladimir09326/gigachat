<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кубик и фишка</title>
  <style>
    body {
      margin: 24px;
      background: #EEF2F7;
      font-family: Arial, sans-serif;
      color: #172033;
    }
    .event-card {
      max-width: 560px;
      margin: 0 auto;
      background: #FFFFFF;
      border-radius: 16px;
      overflow: hidden;
    }
    .cover {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }
    .content { padding: 20px; }
    .button {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      background: #EAB308;
      color: #172033;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <article class="event-card">
    <img class="cover" src="board-games.png"
         alt="Игровое поле с фиолетовыми и жёлтыми фишками и чашка какао на деревянном столе">
    <div class="content">
      <svg width="48" height="48" viewBox="0 0 64 64">
        <rect x="8" y="8" width="48" height="48" rx="12" fill="#7C3AED"/>
        <rect x="18" y="18" width="28" height="28" rx="6" fill="#FFFFFF"/>
        <circle cx="25" cy="25" r="2.5" fill="#7C3AED"/>
        <circle cx="39" cy="25" r="2.5" fill="#7C3AED"/>
        <circle cx="32" cy="32" r="2.5" fill="#7C3AED"/>
        <circle cx="25" cy="39" r="2.5" fill="#7C3AED"/>
        <circle cx="39" cy="39" r="2.5" fill="#7C3AED"/>
      </svg>
      <h1>Кубик и фишка</h1>
      <p>Большой фестиваль современных настольных игр и турниры для новичков.</p>
      <a class="button" href="#details">Подробнее</a>
      <p id="details">Начало в 14:00. Встречаемся в главном зале культурного центра.</p>
    </div>
  </article>
</body>
</html>
